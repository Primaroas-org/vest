<!DOCTYPE html>
<html lang="mn" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vest | Премиум Үл Хөдлөх Хөрөнгийн Хөрөнгө Оруулалт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Inter:wght@100;300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#10B981", // Emerald green
              "emerald-green": "#10b981",
              "background-light": "#F8FAFC",
              "background-dark": "#0F172A",
              "app-bg": "#f8fafc",
              charcoal: {
                DEFAULT: "#1E293B",
                darker: "#020617",
                soft: "#1e293b"
              },
              "deep-charcoal": "#0f172a",
              "charcoal-soft": "#1e293b",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
              body: ["Inter", "sans-serif"],
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "12px",
              xl: "16px",
              "2xl": "24px",
            },
            boxShadow: {
                'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 10px -2px rgba(0, 0, 0, 0.02)',
                'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02)',
            }
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      h1,
      h2,
      h3,
      .font-display {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .hero-gradient {
        background: linear-gradient(
          to right,
          rgba(15, 23, 42, 0.95) 30%,
          rgba(15, 23, 42, 0.4) 100%
        );
      }
      .glass-header {
        backdrop-filter: blur(12px);
        background-color: rgba(255, 255, 255, 0.8);
      }
      .dark .glass-header {
        background-color: rgba(15, 23, 42, 0.8);
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
      .nav-active {
        background-color: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border-right: 2px solid #10b981;
      }
      .card-gradient {
        background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      }
    </style>
  <script type="importmap">

}
